<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Pi Agent Web UI</title>
	<link rel="stylesheet" href="/style.css" />
</head>
<body>
	<div id="app">
		<header id="topbar">
			<span class="logo">Pi</span>
			<span id="conn-dot" class="dot off" title="连接状态"></span>
			<select id="model-select" title="当前模型"></select>
			<select id="thinking-select" title="思考级别"></select>
			<div class="spacer"></div>
			<button id="new-session-btn" type="button">新建会话</button>
			<button id="stop-btn" type="button" disabled>停止</button>
			<button id="settings-btn" type="button">模型设置</button>
		</header>

		<div id="security-banner">
			本服务可执行本机命令，仅监听 127.0.0.1。请勿将其暴露到公网。
			<button id="banner-close" type="button">×</button>
		</div>

		<main id="chat">
			<div id="messages"></div>
			<div id="status-line"></div>
		</main>

		<footer id="composer">
			<textarea id="input" rows="3" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
			<button id="send-btn" type="button">发送</button>
		</footer>
	</div>

	<aside id="settings-drawer" hidden>
		<div id="settings-panel">
			<div class="panel-head">
				<h2>模型设置</h2>
				<button id="settings-close" type="button">×</button>
			</div>
			<div id="config-error" class="error-box" hidden></div>
			<div id="provider-list"></div>
			<button id="add-provider-btn" type="button">+ 新增 Provider</button>

			<form id="provider-form" hidden>
				<h3 id="form-title">编辑 Provider</h3>
				<div class="field">
					<label for="f-id">Provider ID</label>
					<input id="f-id" required placeholder="例如 my-provider" />
				</div>
				<div class="field">
					<label for="f-name">显示名称</label>
					<input id="f-name" placeholder="可选" />
				</div>
				<div class="field">
					<label for="f-baseurl">Base URL</label>
					<input id="f-baseurl" placeholder="例如 https://api.example.com/v1" />
				</div>
				<div class="field">
					<label for="f-api">API</label>
					<select id="f-api">
						<option value="">（内置 Provider 可不填）</option>
						<option value="openai-completions">openai-completions</option>
						<option value="openai-responses">openai-responses</option>
						<option value="anthropic-messages">anthropic-messages</option>
						<option value="google-generative-ai">google-generative-ai</option>
					</select>
				</div>
				<div class="field">
					<label for="f-apikey">API Key</label>
					<input id="f-apikey" placeholder="明文 key、$ENV 环境变量名、或 !命令" />
				</div>
				<div class="field">
					<label for="f-headers">Headers（每行 key=value）</label>
					<textarea id="f-headers" rows="3" placeholder="x-my-header=1"></textarea>
				</div>
				<div class="field">
					<label>模型列表</label>
					<div id="models-list"></div>
					<button id="add-model-btn" type="button">+ 添加模型</button>
				</div>
				<div id="form-error" class="error-box" hidden></div>
				<div class="form-actions">
					<button id="save-provider-btn" type="submit">保存</button>
					<button id="cancel-provider-btn" type="button">取消</button>
					<button id="delete-provider-btn" type="button" class="danger">删除</button>
				</div>
			</form>
		</div>
	</aside>

	<div id="toast" hidden></div>
	<script src="/app.js"></script>
</body>
</html>
